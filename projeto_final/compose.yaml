services:

  backend:
    build: ./backend
    container_name: projeto-backend
    ports:
      - "5000:5000"
    volumes:
      - ./dados:/app/dados

  frontend:
    build: ./frontend
    container_name: projeto-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  ia-service:
    build: ./ia-service
    container_name: projeto-ia-service
    ports:
      - "6001:6000"